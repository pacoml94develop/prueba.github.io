<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Prueba</title>
    
    <style>
        /* CSS: Aquí definimos el diseño */
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 10px;
        }

        p {
            color: #5f6368;
            line-height: 1.6;
        }

        .boton {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .boton:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <!-- HTML: Aquí definimos el contenido -->
    <div class="card">
        <h1>¡Hola Mundo!</h1>
        <p>Este es un ejemplo sencillo de HTML y CSS combinados en un solo archivo. Es ideal para probar estilos rápidos.</p>
        <button class="boton" onclick="alert('¡Funciona!')">Haz clic aquí</button>
    </div>

</body>
</html>
